name: 'gh-action-rl-protect-scan'
author: 'ReversingLabs'
description: 'Scan package manifests using ReversingLabs rl-protect CLI'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  scan-path:
    description: 'Path to the package manifest or lock file'
    type: string
    required: true
  scan-profile:
    description: 'Path to a custom rl-profile or a supported keyword (minimum, baseline, hardened)'
    type: string
    required: false
  # scanning options
  check-deps:
    description: 'CSV list of dependency types to check with Spectra Assure Community. Supported options: develop, release, optional, transitive.'
    required: false
    default: 'release'
    type: string
  transitive-depth:
    description: 'How many levels deep to scan transitive dependencies. Applies only if check-deps includes transitive.'
    required: false
    default: 1
    type: int
  report:
    description: 'Path and filename for exporting the scan results as an rl-protect.json report'
    required: false
    default: ''
    type: string
  # logging options
  log-file:
    description: 'Path to a CEF log file'
    required: false
    default: ""
    type: string
  log-label:
    description: 'An explicit CEF log label for referencing within a SIEM'
    required: false
    default: ""
    type: string
  log-level:
    description: 'Select the desired logging level. Supported options: pass, warn, fail.'
    required: false
    default: "fail"
    type: string
  # authentication
  # rl-token
  #  is passed via the ENVIRONMENT as RL_TOKEN
  rl-server:
    description: 'Spectra Assure Portal to connect to (e.g. https://my.secure.software/organization)'
    type: string
    required: false
    default: ""
  rl-org:
    description: 'Spectra Assure Portal organization'
    type: string
    required: false
    default: ""
  rl-group:
    description: 'Spectra Assure Portal group (optional)'
    type: string
    required: false
    default: ""
  # optional proxy
  proxy-server:
    description: 'An optional proxy server to use'
    required: false
    default: ""
    type: string
    # if proxy-server is specified then proxy-port must also be specified
  proxy-port:
    description: 'An optional proxy server port to use'
    required: false
    default: ""
    type: string
  proxy-user:
    description: 'An optional proxy server user to use'
    required: false
    default: ""
    type: string
    # if proxy-user is specified then proxy-password must also be specified
  proxy-password:
    description: 'An optional proxy server password to use'
    required: false
    default: ""
    type: string
  ca-path:
    description: 'An optional ca certificate path'
    required: false
    default: ""
    type: string
  # boolean options
  concise:
    description: 'Only report the final outcome and skip all details. Default: false'
    required: false
    default: false
    type: bool
  verbose:
    description: 'Increase script verbosity when running the action. Default: false'
    required: false
    default: false
    type: bool
  # pr comment options
  post-pr-comment:
    description: 'Post scan results as a comment on the pull request. Requires github-token. Default: false'
    required: false
    default: false
    type: bool
  github-token:
    description: 'GitHub token used to post the PR comment. Pass secrets.GITHUB_TOKEN. Required when post-pr-comment is true.'
    required: false
    default: ""
    type: string
  comment-template:
    description: 'PR comment template. concise=status summary only, expanded=rejected+warnings, verbose=full detail with policy. Individual comment-* inputs override the template.'
    required: false
    default: ""
    type: string
  comment-level:
    description: 'Minimum finding level in the PR comment: fail, warn, pass. Overrides comment-template when set.'
    required: false
    default: ""
    type: string
  comment-assessment:
    description: 'Assessment display style in the PR comment: table, simplified, off. Overrides comment-template when set.'
    required: false
    default: ""
    type: string
  comment-vulnerabilities:
    description: 'Show the CVE vulnerability table in the PR comment. Default: true'
    required: false
    default: true
    type: bool
  comment-license:
    description: 'Show the package license in the PR comment. Default: false'
    required: false
    default: false
    type: bool
  comment-policy:
    description: 'Show the policy violations table in the PR comment. Default: false'
    required: false
    default: false
    type: bool
  comment-overrides:
    description: 'Show override details on assessments and policy violations in the PR comment. Default: false'
    required: false
    default: false
    type: bool


outputs:
  description:
    description: 'The result of the action: a string terminating in FAIL or PASS'
    value: ${{ steps.rl-protect.outputs.description }}
  status:
    description: 'The single word result of the action: pass or fail'
    value: ${{ steps.rl-protect.outputs.status }}

runs:
  using: "composite"

  steps:
    # -------------------------------------
    # install python
    - name: Install Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'

    # -------------------------------------
    # Run the run-scan.sh script
    # RL_TOKEN is passed via the env already
    - name: Run rl-protect using python
      id: rl-protect
      run: ${{ github.action_path }}/run-scan.sh
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.scan-path }}
        SCAN_PROFILE: ${{ inputs.scan-profile }}
        CHECK_DEPS: ${{ inputs.check-deps }}
        TRANSITIVE_DEPTH: ${{ inputs.transitive-depth }}
        REPORT: ${{ inputs.report }}
        LOG_FILE: ${{ inputs.log-file }}
        LOG_LEVEL: ${{ inputs.log-level }}
        LOG_LABEL: ${{ inputs.log-label }}
        RL_SERVER: ${{ inputs.rl-server }}
        RL_ORG: ${{ inputs.rl-org }}
        RL_GROUP: ${{ inputs.rl-group }}
        PROXY_SERVER: ${{ inputs.proxy-server }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PROXY_USER: ${{ inputs.proxy-user }}
        PROXY_PASSWORD: ${{ inputs.proxy-password }}
        CA_PATH: ${{ inputs.ca-path }}
        CONCISE: ${{ inputs.concise }}
        VERBOSE: ${{ inputs.verbose }}

    # -------------------------------------
    # Post scan results as a PR comment
    - name: Post PR comment
      if: always() && inputs.post-pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SCAN_STATUS: ${{ steps.rl-protect.outputs.status }}
        SCAN_DESCRIPTION: ${{ steps.rl-protect.outputs.description }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        SCAN_PATH: ${{ inputs.scan-path }}
        REPORT: ${{ inputs.report }}
        COMMENT_TEMPLATE: ${{ inputs.comment-template }}
        COMMENT_LEVEL: ${{ inputs.comment-level }}
        COMMENT_ASSESSMENT: ${{ inputs.comment-assessment }}
        COMMENT_VULNERABILITIES: ${{ inputs.comment-vulnerabilities }}
        COMMENT_LICENSE: ${{ inputs.comment-license }}
        COMMENT_POLICY: ${{ inputs.comment-policy }}
        COMMENT_OVERRIDES: ${{ inputs.comment-overrides }}
      run: python3 ${{ github.action_path }}/post-pr-comment.py

    # -------------------------------------
    # Return the proper exit status
    - name: Set the exit status
      if: always()
      shell: bash
      run: |
        case "${{ steps.rl-protect.outputs.status }}" in
        pass)
          exit 0
          ;;
        fail)
          exit 1
          ;;
        *)
          exit 101
          ;;
        esac
